[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgekit"
dynamic = ["version"]
description = "Self-installing WireGuard hub + Nginx Proxy Manager edge server, with a management panel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "cryptography>=42.0",
    "bcrypt>=4.1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
edgekit = "edgekit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "edgekit.__version__"}

[tool.setuptools.package-data]
edgekit = ["templates/*.j2", "web/templates/*.html", "web/templates/icons/*.svg", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
